name: Hosted mathematics

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  capture:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_REVISION: ${{ github.event.pull_request.head.sha }}
      SOURCE_REPOSITORY: ${{ github.repository }}
      CAPTURE_DEPENDENCIES: ${{ runner.temp }}/hosted-math-dependencies
      CAPTURE_EVIDENCE: ${{ runner.temp }}/hosted-math-evidence
    steps:
      - name: Initialize evidence
        run: |
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          assert sys.version_info >= (3, 10)
          output = Path(os.environ['CAPTURE_EVIDENCE'])
          output.mkdir()
          record = {
              'repository': os.environ['SOURCE_REPOSITORY'],
              'revision': os.environ['SOURCE_REVISION'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'python': sys.version,
          }
          (output / 'run-context.json').write_text(json.dumps(record, indent=2) + '\n')
          PY

      - name: Check out the exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false

      - name: Verify source and collector identity
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          sha256sum --check <<'CHECKSUMS'
          49182eaf354e86f685a4976814d672de5d7329a2d9e42f62a5227e2bc07c2d18  verification/hosted/capture_hosted_math.cjs
          edbc2d72af94e96b78166d74b66fcea150134f2f3ebaaea121e9057768e1dbfe  verification/hosted/check_rendered_math.py
          CHECKSUMS

      - name: Install the locked dependencies and Chromium
        timeout-minutes: 7
        run: |
          mkdir "$CAPTURE_DEPENDENCIES"
          cp verification/hosted/package.json verification/hosted/package-lock.json "$CAPTURE_DEPENDENCIES/"
          npm ci --prefix "$CAPTURE_DEPENDENCIES" --ignore-scripts --no-audit --no-fund 2>&1 | tee "$CAPTURE_EVIDENCE/dependencies.log"
          "$CAPTURE_DEPENDENCIES/node_modules/.bin/playwright" install --with-deps chromium 2>&1 | tee "$CAPTURE_EVIDENCE/browser-install.log"

      - name: Capture every tracked Markdown page
        env:
          NODE_PATH: ${{ runner.temp }}/hosted-math-dependencies/node_modules
        run: |
          timeout --signal=TERM --kill-after=15s 12m \
            node verification/hosted/capture_hosted_math.cjs \
            --root "$GITHUB_WORKSPACE" \
            --repository "$SOURCE_REPOSITORY" \
            --revision "$SOURCE_REVISION" \
            --output "$CAPTURE_EVIDENCE/capture" \
            --contract "$GITHUB_WORKSPACE/verification/hosted/math-contract.json" \
            --python python3 2>&1 | tee "$CAPTURE_EVIDENCE/capture.log"

      - name: Upload the observed evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosted-math-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hosted-math-evidence/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
